global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Découverte DNS : "api" renvoie l'IP de chaque réplica (une cible par IP)
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: worker
    static_configs:
      - targets: ['worker:9100']
